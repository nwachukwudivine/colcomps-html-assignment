<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLCOMP Student Registration Form</title>
</head>
<body>

    <header>
        <h1>COLCOMP Student Registration Form</h1>
        <p>College of Computing Sciences</p>
    </header>

    <main>
        <section>
            <h2>Student Registration</h2>
            <p>Please fill in your details below.</p>

            <form action="#" method="post">

                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your full name" required>
                    <br><br>

                    <label for="matric">Matric Number:</label>
                    <input type="text" id="matric" name="matric_number"
                           placeholder="Enter your matric number" required>
                    <br><br>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>
                    <br><br>

                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="Enter your phone number" required>
                    <br><br>

                    <span>Gender:</span>
                    <input type="radio" id="male" name="gender"
                           value="Male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender"
                           value="Female">
                    <label for="female">Female</label>
                    <br><br>

                </fieldset>

                <fieldset>
                    <legend>Academic Information</legend>

                    <label for="department">Department:</label>
                    <select id="department" name="department" required>
                        <option value="">Select your department</option>
                        <option value="Information and Communication Technology">
                            Information and Communication Technology
                        </option>
                        <option value="Cyber Security">Cyber Security</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Information Technology">
                            Information Technology
                        </option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information System">
                            Information System
                        </option>
                        <option value="Software Engineering">
                            Software Engineering
                        </option>
                    </select>
                    <br><br>

                    <label for="programme">Programme:</label>
                    <select id="programme" name="programme" required>
                        <option value="">Select your programme</option>
                        <option value="Full-time Weekdays">
                            Full-time Weekdays
                        </option>
                        <option value="Weekends">Weekends</option>
                    </select>
                    <br><br>

                </fieldset>

                <button type="submit">Submit Registration</button>

            </form>
        </section>
    </main>

</body>
</html>
